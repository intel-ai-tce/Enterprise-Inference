services:
  vllm-ci-test:
    image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:7f42dc20bb2800d09faa72b26f25d54e26f1b694-cpu
    container_name: vllm-ci-test-cpu
    volumes:
      #- "${MODEL_CACHE:-./data}:/root/.cache/huggingface/hub"
      - /mnt/hf_cache:/mnt/hf_cache
      - "./serving-tests-cpu.json:/workspace/.buildkite/performance-benchmarks/tests/serving-tests-cpu.json:ro"
      - "./results:/workspace/benchmarks/results"
    shm_size: 128g
    environment:
      no_proxy: ${no_proxy}
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      HF_TOKEN: ${HF_TOKEN}
      VLLM_CPU_KVCACHE_SPACE: 40
      HF_HOME: /mnt/hf_cache
      REMOTE_HOST: ${REMOTE_HOST}
      REMOTE_PORT: ${REMOTE_PORT}
      ON_CPU: ${ON_CPU}
      #SERVING_JSON: serving-tests-cpu-snc3.json
    entrypoint: ["bash", "/workspace/.buildkite/performance-benchmarks/scripts/run-performance-benchmarks.sh"]

