# ---------------------------------------------------------------------
# NRI Topology Aware: keep Keycloak on SHARED CPUs (NOT exclusive)
# ---------------------------------------------------------------------
podAnnotations:
  prefer-shared-cpus.resource-policy.nri.io/pod: "true"
  prefer-reserved-cpus.resource-policy.nri.io/pod: "true"

# Some charts use "annotations" instead of "podAnnotations". Keep both for safety.
annotations:
  prefer-shared-cpus.resource-policy.nri.io/pod: "true"
  prefer-reserved-cpus.resource-policy.nri.io/pod: "true"

keycloakTokenRoute:
  host: ""
  path: /token
  serviceName: keycloak
  servicePort: 80
  rewritePath: /realms/master/protocol/openid-connect/token
# TLS configuration
tls:
  host: ""
  secretName: ""
  secretNamespace: default
ingress:
  host: ""
  serviceName: auth-apisix-gateway
  servicePort: 80
  secretName: ""
